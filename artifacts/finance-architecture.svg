<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="t d"><title id="t">Компоненты учебного приложения учёта финансов</title><desc id="d">Браузер обращается к Flask приложению. Приложение хранит пользователей и операции в PostgreSQL и получает фиксированный курс от отдельного HTTP-сервиса.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#356c5b"/></marker></defs><rect width="1120" height="620" fill="#f5f7f3"/><g font-family="Arial,sans-serif" fill="#1d3029"><text x="50" y="60" font-size="14" letter-spacing="2">ЛИЧНЫЕ ФИНАНСЫ / КОМПОНЕНТЫ</text><text x="50" y="105" font-size="28">Операции, данные и фиксированные курсы</text><g stroke="#b8c9bd" stroke-width="2" fill="white"><rect x="50" y="230" width="240" height="150" rx="12"/><rect x="420" y="230" width="260" height="150" rx="12"/><rect x="810" y="160" width="260" height="150" rx="12"/><rect x="810" y="380" width="260" height="150" rx="12"/></g><g font-size="23" font-weight="bold"><text x="76" y="275">Браузер</text><text x="446" y="275">Flask · app.py</text><text x="836" y="205">PostgreSQL</text><text x="836" y="425">rate_service.py</text></g><g font-size="17"><text x="76" y="311">HTML-формы</text><text x="76" y="341">Jinja2 · сессия</text><text x="446" y="311">Доходы и расходы</text><text x="446" y="341">Вход · удаление</text><text x="836" y="241">users</text><text x="836" y="270">operations</text><text x="836" y="461">GET /rate</text><text x="836" y="492">USD / EUR · константы</text></g><g fill="none" stroke="#356c5b" stroke-width="2" marker-end="url(#a)"><path d="M290 305H413"/><path d="M680 280H745V235H803"/><path d="M680 330H745V455H803"/></g><g font-size="14"><text x="311" y="290">HTTP</text><text x="703" y="218">psycopg2</text><text x="703" y="480">HTTP / JSON</text><text x="50" y="580" fill="#58675f">Поясняющая схема для портфолио. Подготовлена по исходному коду; запуск не подтверждает.</text></g></g></svg>
