<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="660" viewBox="0 0 1440 660"><title>Процедура проведения операции</title><rect width="1440" height="660" fill="#f7f8f3"/><g font-family="Arial" fill="#243a31"><text x="35" y="55" font-size="32" font-weight="bold">SP_ПРОВЕСТИ_ОПЕРАЦИЮ — порядок проверок</text><text x="35" y="90" font-size="20">Поясняющая визуализация по E0177. Не протокол исполнения.</text><rect x="35" y="125" width="670" height="140" rx="12" fill="#e7eee2" stroke="#a0b69f"/><text x="55" y="169" font-size="27" font-weight="bold">01. Вход</text><text x="55" y="215" font-size="22">Сумма &gt; 0, счёт существует</text><rect x="740" y="125" width="670" height="140" rx="12" fill="#e7eee2" stroke="#a0b69f"/><text x="760" y="169" font-size="27" font-weight="bold">02. Тип и доступ</text><text x="760" y="215" font-size="22">Статус счёта и владелец ИБ</text><rect x="35" y="290" width="670" height="140" rx="12" fill="#e7eee2" stroke="#a0b69f"/><text x="55" y="334" font-size="27" font-weight="bold">03. Остаток</text><text x="55" y="380" font-size="22">Расход не уводит остаток ниже 0</text><rect x="740" y="290" width="670" height="140" rx="12" fill="#e7eee2" stroke="#a0b69f"/><text x="760" y="334" font-size="27" font-weight="bold">04. Лимиты</text><text x="760" y="380" font-size="22">Расход за сутки и месяц</text><rect x="35" y="455" width="670" height="140" rx="12" fill="#e7eee2" stroke="#a0b69f"/><text x="55" y="499" font-size="27" font-weight="bold">05. Запись</text><text x="55" y="545" font-size="22">Транзакция и контрольные записи</text><rect x="740" y="455" width="670" height="140" rx="12" fill="#e7eee2" stroke="#a0b69f"/><text x="760" y="499" font-size="27" font-weight="bold">06. Выход</text><text x="760" y="545" font-size="22">Уведомление в таблице; без отправки</text></g></svg>