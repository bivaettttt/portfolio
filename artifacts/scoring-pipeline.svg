<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="550" viewBox="0 0 1120 550" role="img" aria-labelledby="t"><title id="t">ML pipeline кредитного скоринга и обнаруженная ошибка интерпретации класса</title><rect width="1120" height="550" fill="#f5f7f3"/><g font-family="Arial,sans-serif" fill="#203329"><text x="50" y="60" font-size="14" letter-spacing="2">КРЕДИТНЫЙ СКОРИНГ / УЧЕБНЫЙ ПРОТОТИП</text><text x="50" y="112" font-size="30">От обучения к HTTP-контракту</text><g fill="white" stroke="#bdccbe"><rect x="50" y="175" width="230" height="150" rx="12"/><rect x="315" y="175" width="230" height="150" rx="12"/><rect x="580" y="175" width="230" height="150" rx="12"/><rect x="845" y="175" width="225" height="150" rx="12"/></g><g font-size="23" font-weight="bold"><text x="72" y="220">data.csv</text><text x="337" y="220">train.py</text><text x="602" y="220">model.joblib</text><text x="867" y="220">Flask API</text></g><g font-size="17"><text x="72" y="258">1 000 записей</text><text x="72" y="290">20 признаков</text><text x="337" y="258">Разбиение 80 / 20</text><text x="337" y="290">Tree → Forest</text><text x="602" y="258">Pipeline + mapping</text><text x="602" y="290">0 = bad, 1 = good</text><text x="867" y="258">POST /predict</text><text x="867" y="290">Вероятность + ответ</text></g><g font-size="25" fill="#245b47"><text x="286" y="260">→</text><text x="551" y="260">→</text><text x="816" y="260">→</text></g><rect x="50" y="368" width="1020" height="105" rx="12" fill="#f7e9dd"/><text x="73" y="405" font-size="20" fill="#814420">Найдено при аудите: вероятность good используется как proba_bad.</text><text x="73" y="438" font-size="17" fill="#814420">Высокая вероятность класса 1 приводит к REJECT — интерпретацию нужно исправить.</text><text x="50" y="515" font-size="14" fill="#5e6962">Поясняющая схема для портфолио по исходному коду. Исходный репозиторий не изменён.</text></g></svg>
