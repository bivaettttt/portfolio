<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" role="img" aria-labelledby="title"><title id="title">Две таблицы финансового приложения и внешний ключ с каскадным удалением</title><rect width="1040" height="560" fill="#f5f7f3"/><g font-family="Arial,sans-serif" fill="#1d3029"><text x="50" y="65" font-size="28">Пользователь → финансовые операции</text><g stroke="#bdccc0" fill="white"><rect x="50" y="120" width="340" height="260" rx="10"/><rect x="580" y="120" width="410" height="340" rx="10"/></g><g font-size="25" font-weight="bold"><text x="78" y="166">users</text><text x="608" y="166">operations</text></g><g font-size="19"><text x="78" y="215">id · PK</text><text x="78" y="261">name · UNIQUE, NOT NULL</text><text x="78" y="307">password_hash · NOT NULL</text><text x="608" y="215">id · PK</text><text x="608" y="256">date · DATE</text><text x="608" y="297">sum · NUMERIC(12,2)</text><text x="608" y="338">chat_id · FK → users.id</text><text x="608" y="379">type_operation</text><text x="608" y="420">CHECK: income / expense</text></g><path d="M390 214H485V335H580" fill="none" stroke="#356c5b" stroke-width="2"/><g font-size="17"><text x="404" y="201">1</text><text x="553" y="325">N</text><text x="50" y="510">ON DELETE CASCADE · поясняющая схема для портфолио по init_db.sql</text></g></g></svg>
