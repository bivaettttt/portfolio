<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title">
<title id="title">Укрупнённый маршрут кредитной заявки</title>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#34564a"/></marker></defs>
<rect width="960" height="440" rx="18" fill="#eef3ed"/>
<g fill="#14342a" font-family="system-ui,sans-serif">
<text x="42" y="58" font-size="28" font-weight="700">Маршрут кредитной заявки</text>
<text x="42" y="91" font-size="17">Дополненная документация · укрупнённый пользовательский сценарий</text>
</g>
<g fill="#fff" stroke="#416b5c" stroke-width="2">
<rect x="42" y="136" width="242" height="72" rx="12"/><rect x="359" y="136" width="242" height="72" rx="12"/><rect x="676" y="136" width="242" height="72" rx="12"/>
<rect x="359" y="299" width="242" height="72" rx="12"/><rect x="676" y="299" width="242" height="72" rx="12"/>
</g>
<g stroke="#34564a" stroke-width="2" fill="none" marker-end="url(#arrow)">
<path d="M284 172H352"/><path d="M601 172H669"/><path d="M461 208V292"/><path d="M497 299V215"/><path d="M797 208V292"/>
</g>
<g fill="#14342a" font-family="system-ui,sans-serif" font-size="18" text-anchor="middle">
<text x="163" y="164"><tspan x="163">Клиент заполняет</tspan><tspan x="163" dy="24">и подаёт заявку</tspan></text>
<text x="480" y="164"><tspan x="480">Сервер проверяет,</tspan><tspan x="480" dy="24">банк рассматривает</tspan></text>
<text x="797" y="164"><tspan x="797">Оффер готов</tspan><tspan x="797" dy="24">или заявка отклонена</tspan></text>
<text x="480" y="327"><tspan x="480">Клиент отвечает</tspan><tspan x="480" dy="24">на запрос сведений</tspan></text>
<text x="797" y="327"><tspan x="797">При наличии оффера</tspan><tspan x="797" dy="24">клиент выбирает действие</tspan></text>
<text x="417" y="251" font-size="14">запрос</text><text x="537" y="251" font-size="14">ответ</text>
</g>
</svg>
