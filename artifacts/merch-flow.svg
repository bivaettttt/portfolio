<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title">
<title id="title">Покупка и выдача заказа за баллы</title>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#34564a"/></marker></defs>
<rect width="960" height="440" rx="18" fill="#eef3ed"/>
<g fill="#14342a" font-family="system-ui,sans-serif">
<text x="42" y="58" font-size="28" font-weight="700">Покупка и выдача заказа</text>
<text x="42" y="91" font-size="17">Дополненная документация · учебный прототип ELMA365</text>
</g>
<g fill="#fff" stroke="#416b5c" stroke-width="2">
<rect x="42" y="133" width="230" height="75" rx="12"/><rect x="359" y="133" width="230" height="75" rx="12"/><rect x="677" y="133" width="241" height="75" rx="12"/>
<rect x="359" y="287" width="230" height="75" rx="12"/><rect x="677" y="287" width="241" height="75" rx="12"/>
</g>
<g stroke="#34564a" stroke-width="2" fill="none" marker-end="url(#arrow)">
<path d="M272 170H352"/><path d="M589 170H670"/><path d="M474 208V280"/><path d="M797 208V280"/>
</g>
<g fill="#14342a" font-family="system-ui,sans-serif" font-size="18" text-anchor="middle">
<text x="157" y="163"><tspan x="157">Сотрудник выбирает</tspan><tspan x="157" dy="24">товар и количество</tspan></text>
<text x="474" y="163"><tspan x="474">Система проверяет</tspan><tspan x="474" dy="24">баланс и остаток</tspan></text>
<text x="797" y="163"><tspan x="797">Система создаёт заказ</tspan><tspan x="797" dy="24">и фиксирует списание</tspan></text>
<text x="474" y="317"><tspan x="474">Система сообщает</tspan><tspan x="474" dy="24">об отказе</tspan></text>
<text x="797" y="311"><tspan x="797">Ответственный готовит</tspan><tspan x="797" dy="21">заказ, уведомляет</tspan><tspan x="797" dy="21">и отмечает выдачу</tspan></text>
<text x="631" y="155" font-size="14">хватает</text><text x="522" y="248" font-size="14">не хватает</text>
</g>
</svg>
